repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml

    - repo: https://github.com/betterleaks/betterleaks
      rev: v1.5.0
      hooks:
          - id: betterleaks

    - repo: local
      hooks:
          - id: backend-ruff-check
            name: backend ruff check
            entry: bash -lc 'cd backend && uv run ruff check'
            language: system
            pass_filenames: false

          - id: backend-ruff-format-check
            name: backend ruff format check
            entry: bash -lc 'cd backend && uv run ruff format --check'
            language: system
            pass_filenames: false

          - id: frontend-biome
            name: frontend biome
            entry: bash -lc 'cd frontend && pnpm run lint'
            language: system
            pass_filenames: false
