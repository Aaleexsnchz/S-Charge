repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: bash -lc 'cd backend && uv run ruff check app'
        language: system
        pass_filenames: false

      - id: backend-ruff-format-check
        name: backend ruff format check
        entry: bash -lc 'cd backend && uv run ruff format --check app'
        language: system
        pass_filenames: false

      - id: backend-mypy
        name: backend mypy
        entry: bash -lc 'cd backend && uv run mypy app'
        language: system
        pass_filenames: false

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -lc 'cd frontend && pnpm lint'
        language: system
        pass_filenames: false

      - id: frontend-prettier-check
        name: frontend prettier check
        entry: bash -lc 'cd frontend && pnpm format:check'
        language: system
        pass_filenames: false
