server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles ship with eternal cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html and the PWA service worker must never be stale — clients
  # re-fetch on every load so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /sw.js {
    add_header Cache-Control "no-store";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-store";
  }

  # SPA fallback: any unmatched path renders the app; React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
