# Production stack (VPS): Caddy (TLS, single origin) -> nginx frontend + FastAPI
# backend, Postgres on the internal network only, supercronic scheduler for the
# refresh ETLs. Standalone file, NOT an override of docker-compose.yml — its own
# project name keeps images/volumes/networks separate from the dev stack.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads every variable from the root .env (see .env.example), server-side only
# and never committed. APP_VERSION comes from the environment CD exports, not
# from that file: it is baked into the images at build time.
name: s-charge-prod

# Every image is stamped with the same version, exported by CD from the git tag.
# Unset (a local `just prod-up`) passes an empty string, and each artifact owns
# its own fallback: app/config.py for the backend, ProfilePage for the bundle.
x-version-arg: &version-arg
  APP_VERSION: ${APP_VERSION-}

# Docker keeps container logs forever by default. These carry client IPs, which
# are personal data, so they get a ceiling rather than an unbounded disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      # Loopback only. A 0.0.0.0 publish would be reachable from the internet
      # regardless of ufw, because Docker's DNAT runs ahead of ufw's chain; a
      # 127.0.0.1 rule matches a destination no external packet can carry. This
      # is what lets an SSH tunnel reach the database without exposing it.
      - "127.0.0.1:5432:5432"
    volumes:
      # 18+ stores data in a major-version subdirectory of /var/lib/postgresql
      # and declares that as the volume. Mounting the old /var/lib/postgresql/data
      # makes the entrypoint abort rather than write to a path the next rebuild
      # would discard.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
      args: *version-arg
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy

  # Off until Phase 7 turns the ETLs back on. A profile rather than a deploy-time
  # flag: `up -d` skips it, so cd.yml cannot start it by forgetting something.
  # Enable with `docker compose -f docker-compose.prod.yml --profile scheduler up -d`.
  scheduler:
    profiles: ["scheduler"]
    <<: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: scheduler
      args: *version-arg
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Europe/Madrid
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args: *version-arg
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    <<: *logging
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?define SITE_ADDRESS in the server-side root .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  # Pinned to the names they had under the old `ev-charging-app-prod` project.
  # Compose derives a volume's real name from the project, so renaming the
  # project without these would bring production up on an empty database.
  postgres_data:
    name: ev-charging-app-prod_postgres_data
  caddy_data:
    name: ev-charging-app-prod_caddy_data
  caddy_config:
    name: ev-charging-app-prod_caddy_config
