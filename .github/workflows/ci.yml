name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend (Python + uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: uv sync --locked --all-groups
      - name: Lint (ruff)
        run: uv run ruff check app
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Syntax check
        run: uv run python -m compileall app
      - name: Run backend tests
        run: |
          set +e
          uv run pytest -q
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            exit "$code"
          fi

  frontend:
    name: Frontend (React + pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Run frontend tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
