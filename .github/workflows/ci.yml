name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only on pull requests: a superseded run on `main` must still finish, because
  # it is the run that writes the shared image layer cache every branch reads.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python + uv)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d app_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci_test_user:ci_test_password@localhost:5432/app_db_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        # Pinned to a full version: setup-uv stopped publishing floating major
        # tags after v7, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Both are pinned again in backend/Dockerfile, so CI resolves uv.lock
          # with the same uv and the same interpreter that build the images. The
          # `renovate:` annotations are what keep the two files in lockstep.
          # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
          version: '0.11.32'
          # renovate: datasource=docker depName=python
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --locked --all-groups
      - name: Lint (ruff check)
        run: uv run ruff check
      - name: Format check (ruff format)
        run: uv run ruff format --check
      - name: Type check (basedpyright)
        run: uv run basedpyright
      - name: Check the committed OpenAPI schema matches the app
        run: uv run python -m scripts.export_openapi --check
      - name: Generate ephemeral test secret for JWT signing
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend (React + pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # Version comes from `packageManager`; passing both is an error.
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the generated API types match the schema
        run: |
          pnpm run gen:api
          pnpm exec biome check --write src/lib/api/schema.d.ts
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || { echo "::error::schema.d.ts is stale. Run 'just gen-api' and commit."; exit 1; }
      - name: Lint
        run: pnpm run lint
      - name: Run frontend tests
        run: pnpm run test
      - name: Build
        run: pnpm run build

  images:
    name: Image build check (no push)
    runs-on: ubuntu-latest
    # Built and thrown away — nothing is pushed to a registry and the deploy
    # builds its own images on the VPS (infra-0003). The point is only that a
    # broken Dockerfile fails on the pull request that caused it rather than on
    # the server, half way through a deploy.
    #
    # Only `main` writes the layer cache. A cache written on a branch is
    # readable from that branch alone, so a pull request's `mode=max` export
    # helps nothing later and evicts the entries that do, against a 10 GB quota
    # shared with the uv and pnpm caches.
    env:
      CACHE_TO_BACKEND_PROD: ${{ github.event_name == 'push' && 'type=gha,scope=backend-prod,mode=max' || '' }}
      CACHE_TO_BACKEND_SCHEDULER: ${{ github.event_name == 'push' && 'type=gha,scope=backend-scheduler,mode=max' || '' }}
      CACHE_TO_FRONTEND_PROD: ${{ github.event_name == 'push' && 'type=gha,scope=frontend-prod,mode=max' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend (prod)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          cache-from: type=gha,scope=backend-prod
          cache-to: ${{ env.CACHE_TO_BACKEND_PROD }}
      - name: Build backend (scheduler)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: scheduler
          cache-from: type=gha,scope=backend-scheduler
          cache-to: ${{ env.CACHE_TO_BACKEND_SCHEDULER }}
      - name: Build frontend (prod)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          cache-from: type=gha,scope=frontend-prod
          cache-to: ${{ env.CACHE_TO_FRONTEND_PROD }}

  secrets:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan is over the whole history, not the diff.
          fetch-depth: 0
      - name: Scan the full history
        env:
          # renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks
          # A custom manager keeps a digest that is already there but cannot add
          # a missing one, so the first pin is by hand and Renovate maintains it.
          BETTERLEAKS_VERSION: v1.7.3@sha256:4522fe41a2d22f9bf9b4100c20488b79a5af5c37abc8f3d0cdccdcc47dac3523
        # --user: git refuses to read a repository owned by another uid, and the
        # image runs as root while the workspace belongs to the runner.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            "ghcr.io/betterleaks/betterleaks:$BETTERLEAKS_VERSION" \
            git /repo --no-banner --redact
