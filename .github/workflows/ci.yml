name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend (Python + uv)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d app_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci_test_user:ci_test_password@localhost:5432/app_db_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        # Pinned to a full version: setup-uv stopped publishing floating major
        # tags after v7, so `@v9` does not resolve.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: uv sync --locked --all-groups
      - name: Lint (ruff check)
        run: uv run ruff check
      - name: Format check (ruff format)
        run: uv run ruff format --check
      - name: Type check (basedpyright)
        run: uv run basedpyright
      - name: Generate ephemeral test secret for JWT signing
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend (React + pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Run frontend tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
