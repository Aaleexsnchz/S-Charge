name: Release

# Tags are pushed by hand; this only turns one into a GitHub Release whose notes
# are the merged pull request titles (infra-0002). Deploying is CD's job and
# happens on merge to main, not here.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --generate-notes diffs against the previous tag, which has to be
          # present locally to be found.
          fetch-depth: 0
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
