name: CD

# Deploys to the VPS. Shipping is a deliberate act, not a side effect of merging
# (infra-0003): a tag push deploys that release, and the manual run deploys the
# default branch for a look on a real device. The deploy is a checkout + compose
# rebuild + alembic upgrade, executed over SSH.
#
# Only tag commits that are already on `main`: the deploy trusts that CI has
# already passed on that tree, which is true for a merged commit and not
# otherwise.
#
# Required repository secrets:
#   DEPLOY_HOST         VPS hostname or IP
#   DEPLOY_USER         SSH user (non-root, in the docker group)
#   DEPLOY_SSH_KEY      private key authorized on the VPS (deploy-only key)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` (pins the host key)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Authenticates to the VPS by SSH key and never calls the GitHub API, so it
    # needs no GITHUB_TOKEN scope at all.
    permissions: {}
    steps:
      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Check out the ref, rebuild, migrate
        env:
          # A tag for a release, the default branch for a manual run.
          DEPLOY_REF: ${{ github.ref_type == 'tag' && github.ref_name || 'origin/main' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_REF='${DEPLOY_REF}' bash -s" <<'REMOTE'
          # The brace group is load-bearing. `bash -s` reads this script from
          # the same stdin the commands inside it inherit, so `docker compose`
          # swallowed everything after the line it ran on and bash exited 0
          # having silently skipped the build. Grouping forces bash to parse to
          # the closing brace before running anything.
          {
          set -euo pipefail
          cd /opt/s-charge
          compose="docker compose -f docker-compose.prod.yml"

          # Detached on purpose: the server tracks the deployed ref, never a
          # moving branch, so nothing arrives that was not deployed deliberately.
          git fetch --tags --force --prune origin
          git checkout --force --detach "$DEPLOY_REF"
          export APP_VERSION="$(git describe --tags --always)"
          echo "Deploying $DEPLOY_REF as $APP_VERSION"

          # Migrations are the one step redeploying an older tag cannot undo, so
          # take a dump first. Credentials stay inside the container; the host
          # shell never reads them.
          if $compose ps --status running --services | grep -qx db; then
            mkdir -p backups
            $compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"' \
              > "backups/pre-migrate-$(date -u +%Y%m%dT%H%M%SZ).dump"
            ls -1t backups/pre-migrate-*.dump | tail -n +6 | xargs -r rm --
          else
            echo "db is not running yet; skipping the pre-migration dump"
          fi

          $compose up -d --build
          $compose exec -T backend alembic upgrade head
          docker image prune -f
          }
          REMOTE
