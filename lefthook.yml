# Standard `**` semantics. lefthook's default matcher requires at least one
# directory level, so `frontend/**/*.json` would silently miss package.json.
glob_matcher: doublestar

# Refuse the commit if lefthook cannot be found rather than warning and letting
# it through. `lefthook install` bakes the interpreter version into the path it
# writes to .git/hooks, so recreating the venv on a new Python silently unhooks
# the repository — `just install` puts it back.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: ruff
      root: backend/
      glob: 'backend/**/*.py'
      # --force-exclude: ruff ignores its own exclude list when paths are passed explicitly.
      run: uv run ruff check --fix --force-exclude {staged_files} && uv run ruff format --force-exclude {staged_files}
      stage_fixed: true

    - name: biome
      root: frontend/
      glob: 'frontend/**/*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true

    - name: secrets
      run: betterleaks git . --pre-commit --staged --no-banner --redact

pre-push:
  parallel: true
  jobs:
    - name: ruff
      root: backend/
      run: uv run ruff check

    - name: ruff-format
      root: backend/
      run: uv run ruff format --check

    - name: basedpyright
      root: backend/
      run: uv run basedpyright

    - name: pytest
      root: backend/
      # The suite needs the Postgres *server* — conftest creates and drops its
      # own database from TEST_DATABASE_URL. It must never reach the
      # application one, so DATABASE_URL is poisoned here: locally both exist
      # and share credentials, so a test that reaches for app.database.engine
      # would pass in the hook and fail in CI, where only the test database is
      # provisioned.
      run: >-
        docker compose -f ../docker-compose.yml up -d db &&
        DATABASE_URL=postgresql+asyncpg://forbidden@127.0.0.1:1/forbidden
        uv run pytest

    - name: biome
      root: frontend/
      run: pnpm run lint

    - name: vitest
      root: frontend/
      run: pnpm run test

    - name: build
      root: frontend/
      run: pnpm run build
