# Standard `**` semantics. lefthook's default matcher requires at least one
# directory level, so `frontend/**/*.json` would silently miss package.json.
glob_matcher: doublestar

# Refuse the commit if lefthook cannot be found rather than warning and letting
# it through. `lefthook install` bakes the interpreter version into the path it
# writes to .git/hooks, so recreating the venv on a new Python silently unhooks
# the repository — `just install` puts it back.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    - name: ruff
      root: backend/
      glob: 'backend/**/*.py'
      # --force-exclude: ruff ignores its own exclude list when paths are passed explicitly.
      run: uv run ruff check --fix --force-exclude {staged_files} && uv run ruff format --force-exclude {staged_files}
      stage_fixed: true

    - name: biome
      root: frontend/
      glob: 'frontend/**/*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true

    - name: secrets
      run: betterleaks git . --pre-commit --staged --no-banner --redact

pre-push:
  parallel: true
  jobs:
    - name: ruff
      root: backend/
      run: uv run ruff check

    - name: ruff-format
      root: backend/
      run: uv run ruff format --check

    - name: basedpyright
      root: backend/
      run: uv run basedpyright

    - name: pytest
      root: backend/
      # The suite needs the Postgres *server* — conftest creates and drops its
      # own database from TEST_DATABASE_URL. It must never reach the
      # application one, so DATABASE_URL is poisoned here: locally both exist
      # and share credentials, so a test that reaches for app.database.engine
      # would pass in the hook and fail in CI, where only the test database is
      # provisioned.
      run: >-
        docker compose -f ../docker-compose.yml up -d db &&
        DATABASE_URL=postgresql+asyncpg://forbidden@127.0.0.1:1/forbidden
        uv run pytest

    - name: biome
      root: frontend/
      run: pnpm run lint

    - name: vitest
      root: frontend/
      run: pnpm run test

    # Both halves of the API contract, and the build that consumes it. They are
    # push-gated rather than commit-gated because neither is a function of the
    # staged files: `--check` imports the whole app to render the schema, and
    # gen:api regenerates the types from the committed openapi.json. A slice
    # also legitimately splits the router edit and the regenerated artifacts
    # across commits, which a per-commit gate would reject.
    - name: api-contract
      # Piped, not parallel: gen:api and biome --write rewrite schema.d.ts in
      # the working tree, and `pnpm run build` typechecks against that same
      # file. Run concurrently, tsc reads it mid-truncation and the build fails
      # for reasons that have nothing to do with the code.
      group:
        piped: true
        jobs:
          - name: openapi-check
            root: backend/
            run: uv run python -m scripts.export_openapi --check

          - name: api-types-check
            root: frontend/
            run: >-
              pnpm run gen:api &&
              pnpm exec biome check --write src/lib/api/schema.d.ts &&
              { git diff --exit-code -- src/lib/api/schema.d.ts ||
                { echo "schema.d.ts is stale. Run 'just gen-api' and commit."; exit 1; }; }

          - name: build
            root: frontend/
            run: pnpm run build
