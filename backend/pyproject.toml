[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for an EV charging management PWA (master's thesis)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alejandro Sánchez Bardera", email = "sanchezbarderaalejandro@gmail.com" },
]
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.2",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-json-logger>=4.1.0",
    "resend>=2.29.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "lefthook>=2.1.10",
]

[tool.ruff]
target-version = "py312"
src = ["app"]
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PIE", "RET", "TID", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts + fake credentials are fine in tests

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
