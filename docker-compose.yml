name: ev-charging-app

# Dev stack: backing services only. The backend and frontend run natively on the
# host (`just api` / `just web`) so the toolchain that gates commits and CI is the
# same one that runs the app. The full containerised stack lives in
# docker-compose.prod.yml — `just prod-up` smoke-tests it locally.

services:
  db:
    # Still 17 while CI and production run 18: this volume holds the REVE seed and
    # the data directory is not compatible across majors. Cutting over is a dump +
    # `down -v` + restore, planned in docs/phases/phase-5.md.
    image: postgres:17-alpine
    container_name: ev-charging-app-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ev_charging_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ev_charging_app_postgres_data:
