name: s-charge

# Dev stack: backing services only. The backend and frontend run natively on the
# host (`just api` / `just web`) so the toolchain that gates commits and CI is the
# same one that runs the app. The full containerised stack lives in
# docker-compose.prod.yml — `just prod-up` smoke-tests it locally.

services:
  db:
    image: postgres:18-alpine
    container_name: s-charge-db
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      # Loopback only: on shared wifi a 0.0.0.0 bind accepts connections from
      # anyone on the network. The backend runs on the host, so it does not
      # need more than this.
      - "127.0.0.1:5432:5432"
    volumes:
      # 18+ keeps data in a major-version subdirectory and declares
      # /var/lib/postgresql as the volume; the old path aborts the entrypoint.
      - ev_charging_app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Pinned to the name it had under the old `ev-charging-app` project. Compose
  # derives a volume's real name from the project, so renaming the project
  # would silently point Postgres at an empty volume and orphan the REVE seed
  # that costs ~12 days to rebuild under the rate cap.
  ev_charging_app_postgres_data:
    name: ev-charging-app_ev_charging_app_postgres_data
